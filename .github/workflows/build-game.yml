          path: |
            .haxelib/
            export/release/linux/haxe/
            export/release/linux/obj/

      - name: Install LibVLC
        id: libvlc-install
        run: |
          sudo apt-get install libvlc-dev libvlccore-dev

      - name: Install / Update Libraries
        id: lib-install
        run: |
          haxe -cp setup -D analyzer-optimize --run Setup -quiet

      - name: Build Game
        id: game-compile
        run: |
          haxelib run lime build linux -release

      - name: Upload Artifact
        id: artifact-upload
        uses: actions/upload-artifact@v6
        with:
          name: VS IMPOSTOR Pixel (Linux)
