name: Build Game

on: push

jobs:
  build_windows:
    name: Windows
    runs-on: windows-latest
    permissions: write-all
    steps:
      - name: Checkout Repository
        id: repo-check
        uses: actions/checkout@v6

      - name: Install Haxe
        id: haxe-install
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Restore Cache
        id: cache-restore
        uses: actions/cache/restore@v5
        with:
          key: cache_windows
          restore-keys: cache_windows
          path: |
            .haxelib/
            export/release/windows/haxe/
            export/release/windows/obj/

      - name: Install / Update Libraries
        id: lib-install
        run: |
          haxe -cp setup -D analyzer-optimize --run Setup --no-vscheck -quiet

      - name: Build Game
        id: game-compile
        run: |
          haxelib run lime build windows -release

      - name: Upload Artifact
        id: artifact-upload
        uses: actions/upload-artifact@v6
        with:
          name: VS IMPOSTOR Pixel (Windows)
          path: export/release/windows/bin/

      - name: Clear old Cache
        id: cache-clear
        uses: actions/github-script@v8
        with:
          script: |
            const caches = github.rest.actions.deleteActionsCacheByKey({
              owner: context.repo.owner,
              repo: context.repo.repo,
              key: "cache_windows"
            });

      - name: Save new Cache
        id: cache-save
        uses: actions/cache/save@v5
        with:
          key: cache_windows
          path: |
            .haxelib/
            export/release/windows/haxe/
            export/release/windows/obj/

  build_linux:
    name: Linux
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout Repository
        id: repo-check
        uses: actions/checkout@v6

      - name: Install Haxe
