          haxe -cp setup -D analyzer-optimize --run Setup -quiet

      - name: Build Game
        id: game-compile
        run: |
          arch -x86_64 haxelib run lime build mac -release

      - name: Upload Artifact
        id: artifact-upload
        uses: actions/upload-artifact@v6
